services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: collabitat
      POSTGRES_PASSWORD: collabitat
      POSTGRES_DB: collabitat
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabitat"]
      interval: 2s
      retries: 15

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://collabitat:collabitat@db:5432/collabitat
      WEB_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
