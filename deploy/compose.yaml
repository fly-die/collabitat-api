# Production stack: Postgres, the API and Caddy for HTTPS.
# Needs API_DOMAIN, WEB_ORIGINS and POSTGRES_PASSWORD (see deploy.sh).
name: collabitat

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: collabitat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: collabitat
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabitat"]
      interval: 5s
      retries: 20
    logging: *logging

  api:
    build: ..
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://collabitat:${POSTGRES_PASSWORD:?}@db:5432/collabitat
      WEB_ORIGINS: ${WEB_ORIGINS:?}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      start_period: 20s
      retries: 6
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
